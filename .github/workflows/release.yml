# Release pipeline: tag push v* -> Electron builds for macOS arm64 and x64,
# Linux x64, and Windows x64 -> GitHub Release.
#
# scripts/set-version.mjs writes the tag into apps/desktop/package.json before
# electron-builder. That file is the only version source. electron-updater
# reads the metadata electron-builder emits next to the installers:
#   macOS    zip + latest-mac.yml   (one job builds arm64 and x64 so the
#            metadata lists both archives)
#   Linux    AppImage + latest-linux.yml
#   Windows  NSIS + latest.yml
#
# Tag-push only. contents: write is limited to creating the Release.
# No code signing is required. CSC_LINK is passed through when the secret
# exists; otherwise the artifacts are unsigned.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64-x64
            artifact: desktop-macos
            builder: --mac --arm64 --x64
          - os: ubuntu-22.04
            name: linux-x64
            artifact: desktop-linux
            builder: --linux --x64
          - os: windows-latest
            name: windows-x64
            artifact: desktop-windows
            builder: --win --x64
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux AppImage dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set app version from tag
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME}"

      - name: Build the renderer
        run: pnpm --filter @stride/desktop build

      - name: Bundle and package
        run: node apps/desktop/scripts/build-electron.mjs ${{ matrix.builder }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Verify package version matches the tag
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'node:fs'
            const version = JSON.parse(readFileSync('apps/desktop/package.json', 'utf8')).version
            const want = process.env.GITHUB_REF_NAME.replace(/^v/, '')
            if (version !== want) {
              console.error('package version ' + version + ' does not match tag ' + want)
              process.exit(1)
            }
            console.log('package version: ' + version)
          "

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apps/desktop/release/
          if-no-files-found: error

  release:
    name: publish installers and updater metadata
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist-release
          merge-multiple: true

      - name: Create release with installers and updater metadata
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist-release/*.dmg
            dist-release/*.zip
            dist-release/*.zip.blockmap
            dist-release/latest-mac.yml
            dist-release/*.AppImage
            dist-release/latest-linux.yml
            dist-release/*.exe
            dist-release/*.exe.blockmap
            dist-release/latest.yml

<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9EDF3"/>
      <stop offset="1" stop-color="#C9D2DE"/>
    </linearGradient>
  </defs>
  <!-- squircle background -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="none" stroke="#000000" stroke-opacity="0.10" stroke-width="8"/>
  <!-- note card, rounded corners, dog-ear top-right -->
  <path d="M 310 262
           H 668
           L 742 336
           V 734
           Q 742 762 714 762
           H 310
           Q 282 762 282 734
           V 290
           Q 282 262 310 262
           Z" fill="#FFFFFF"/>
  <!-- dog-ear flap -->
  <path d="M 668 262 V 336 H 742 Z" fill="url(#fold)"/>
  <!-- text lines -->
  <rect x="330" y="372" width="200" height="30" rx="15" fill="#CBD5E1"/>
  <rect x="330" y="442" width="160" height="30" rx="15" fill="#CBD5E1"/>
  <!-- stride arrow: 45deg lower-left to upper-right, indigo -->
  <line x1="380" y1="688" x2="612" y2="456" stroke="#6366F1" stroke-width="64" stroke-linecap="round"/>
  <path d="M 680 388 L 666 529 L 539 402 Z" fill="#6366F1"/>
</svg>

[package]
name = "stride-desktop"
version = "0.1.0"
edition = "2021"
description = "Stride local-first notes"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-keyring = "0.1.0"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"

# The updater is desktop-only (mobile has its own store-driven update flow).
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
# zip/tar support is Windows-only and its crate versions are yanked upstream;
# macOS updates ship as .app.tar.gz, so the default "zip" feature stays off.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

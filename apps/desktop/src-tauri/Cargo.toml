[package]
name = "stride-desktop"
version = "0.1.0"
edition = "2021"
description = "Stride local-first notes"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-keyring = "0.1.0"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"

# Dock menu injection uses AppKit. Linux builds must not pull GTK through muda.
[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.20"
objc2 = "0.6"

# The updater is desktop-only (mobile has its own store-driven update flow).
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
# The "zip" feature covers the Linux AppImage updater format (.AppImage.tar.gz
# unpacked only with the feature on). Windows ships the raw NSIS/MSI installer
# as its updater artifact (verified on CI, tauri-cli 2.12) and macOS uses the
# unconditional tar/flate2 path, so the feature is inert there. It was disabled
# on 2026-10-16 because the `zip` crate versions were yanked upstream; they
# have since been unyanked (zip 4.6.1 resolves; verified via the crates.io
# index).
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy", "zip"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
